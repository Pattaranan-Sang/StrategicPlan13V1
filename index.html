function renderSuggest(){
  const q = state.quarter;
  const items = DATA.kr_order.map(k=>{
    const pct = krVal(k,q);
    const st = statusOf(pct);
    return {k, pct, st, rec: DATA.krs[k]};
  }).filter(x=>['high','alert','na'].includes(x.st.key))
    .sort((a,b)=>{
      const order = {high:0, alert:1, na:2};
      if(order[a.st.key]!==order[b.st.key]) return order[a.st.key]-order[b.st.key];
      return (a.pct??0)-(b.pct??0);
    });

  const recText = (st, k, rec)=>{
    if(st.key==='high') return `ตัวชี้วัด ${k} อยู่ในระดับความเสี่ยงสูง (High Risk) ควรจัดทำแผนเร่งรัด (Corrective Action Plan) เป็นการด่วน วิเคราะห์สาเหตุของช่องว่างระหว่างผลการดำเนินงานกับค่าเป้าหมาย และรายงานความคืบหน้าต่อผู้บริหารเป็นรายเดือน`;
    if(st.key==='alert') return `ตัวชี้วัด ${k} อยู่ในระดับเฝ้าระวัง (Alert, Medium Risk) ควรทบทวนแผนการดำเนินงานในไตรมาสถัดไป เพิ่มมาตรการสนับสนุน และติดตามความคืบหน้าอย่างใกล้ชิด`;
    return `ตัวชี้วัด ${k} ยังไม่มีข้อมูลผลการดำเนินงานที่สมบูรณ์ในไตรมาสนี้ ควรประสานหน่วยงานที่เกี่ยวข้องให้บันทึกผลให้ครบถ้วนเพื่อการประเมินที่แม่นยำ`;
  };

  if(items.length===0){
    return `
    ${renderSuggestControls()}
    <div class="card empty-state">
      ${ICONS.check}
      <div style="font-weight:700;font-size:15px;color:var(--ink);">ทุกตัวชี้วัดอยู่ในระดับที่น่าพอใจสำหรับไตรมาส ${q}</div>
      <div style="font-size:13px;margin-top:6px;">ไม่มีตัวชี้วัดที่อยู่ในระดับ Alert, High Risk หรือ N/A</div>
    </div>`;
  }

  const list = items.map(x=>`
    <div class="suggest-item" style="border-left-color:${colorFor(x.st.color)}">
      <div class="kr-badge" style="background:${colorFor(x.st.color)};color:${onFill(x.st.key)}">${x.k}</div>
      <div class="content">
        <div class="title" style="color:${colorFor(x.st.ink)}">${x.st.label} &middot; ${fmtPct(x.pct)}</div>
        <div class="name">${escapeHtml((x.rec.name_en||x.rec.name_th||''))}</div>
        <div class="rec">${recText(x.st,x.k,x.rec)}</div>
        ${signalHtml(x.k,q)}
      </div>
    </div>`).join('');

  return `${renderSuggestControls()}<div class="dq-note">ข้อเสนอด้านล่างสร้างอัตโนมัติจากเกณฑ์สถานะ ไม่ใช่ข้อสรุปจากเจ้าของ KR — "สัญญาณจากข้อมูล" คือข้อเท็จจริงในไฟล์</div><div class="suggest-list">${list}</div>`;
}

  return `<div class="control-bar">
    ${renderQuarterLabel('ข้อเสนอแนะสำหรับไตรมาส:')}
  </div>`;
}

/* floating tooltip สำหรับ .res-tip (ไม่ถูกตัดด้วย overflow ของตาราง) */
(function(){
  let tip=null;
  function show(el){
    if(!tip){ tip=document.createElement('div'); tip.className='float-tip'; tip.setAttribute('role','tooltip'); document.body.appendChild(tip); }
    tip.textContent=el.getAttribute('data-tip'); tip.style.display='block';
    const r=el.getBoundingClientRect(), t=tip.getBoundingClientRect();
    let x=r.left+r.width/2-t.width/2; x=Math.max(8,Math.min(x,window.innerWidth-t.width-8));
    let y=r.top-t.height-8; if(y<8) y=r.bottom+8;
    tip.style.left=x+'px'; tip.style.top=y+'px';
  }
  function hide(){ if(tip) tip.style.display='none'; }
  document.addEventListener('mouseover',e=>{ const el=e.target.closest&&e.target.closest('.res-tip'); if(el) show(el); });
  document.addEventListener('mouseout',e=>{ if(e.target.closest&&e.target.closest('.res-tip')) hide(); });
  document.addEventListener('focusin',e=>{ const el=e.target.closest&&e.target.closest('.res-tip'); if(el) show(el); });
  document.addEventListener('focusout',hide);
  document.addEventListener('click',e=>{ const el=e.target.closest&&e.target.closest('.res-tip'); if(el) show(el); else hide(); });
  window.addEventListener('scroll',hide,true);
})();

    var k=(e.key||'').toLowerCase(), c=e.ctrlKey||e.metaKey;
    if(inp(e)&&c&&['a','x'].indexOf(k)>-1){ return; }
    if(e.key==='F12' || (c && ['c','x','a','s','p','u'].indexOf(k)>-1) || (c && e.shiftKey && ['i','j','c','k'].indexOf(k)>-1) || (e.metaKey && e.altKey && ['i','j','u','c'].indexOf(k)>-1)){ stop(e); }
  },true);
  document.addEventListener('copy',function(e){ if(e.clipboardData) e.clipboardData.setData('text/plain',''); },true);
  window.exportCsv = function(){};
  window.print = function(){};
})();
</script>
